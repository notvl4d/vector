<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <script src="https://unpkg.com/cytoscape/dist/cytoscape.min.js"></script>
    <script defer src="script.js"></script>
    

    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <title>Acasă</title>
    
</head>
<body>
    <header>
        <div class="centered">
            <div class="topbar"> 
                <div class="title">VECTOR</div>
                <div class="other-pages">
                    <a href="index.html">Acasă</a> 
                    <a href="documentatie.html">Documentație</a>
                </div>

            </div>
        </div>
    </header>
    <main>
        <div class="container">
            <div class="vertical-container">
                <div class="dynamic-container">
                    <div class="information">
                        Introduceti datele in formatul [nr noduri/nr muchii]:
                    </div>  
                    <textarea class="date" placeholder="[nr. noduri/nr. muchii]" id="inputNrMuchii"></textarea>
                </div>
                <div class="dynamic-container">
                    <div class="information">
                        Introduceti muchiile in formatul [nod1/nod2/cost]:
                    </div>
                    <textarea class="date" placeholder="[x/y/cost]" id="inputMuchii"></textarea>
                </div>
                <div class="dynamic-container">
                    <div class="information">
                        Introduceti nodurile de start si de interes in formatul [nrinterese/nodstart interese]:
                    </div>
                    <textarea class="date" placeholder="[nrinterese/nodstart interese]" id="inputInterese"></textarea>
                </div>
            </div>
            <div class="dynamic-container">
                <button class="calculate-button" onclick="calculate()">Calculeaza</button>
		        <button class="example-button" onclick="example()">Exemplu</button>
            </div>
            <textarea class="box" placeholder="Date de iesire" readonly id="output"></textarea>

        </div>
        <div class = "centered-simple">
            <div id="graf" class="graf">
            </div>
        </div>
    </main>

    <!--Footer-->
    <footer>
        <div class="footer-content">
            <div class="footer-text">Holban Vlad<br>Nicu Eduard</div>
            <div class="footer-links">
                <a href="https://github.com/notvl4d/vector"><img src="https://upload.wikimedia.org/wikipedia/commons/9/91/Octicons-mark-github.svg" alt="GitHub"></a>
            </div>
        </div>
    </footer>
</body>
</html>
